[package]
name = "nomad-amm"
version = "0.2.0"
description = "Nomad Finance Oracle AMM, Pyth-Lazer-anchored quotes on Solana"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "nomad_amm"

[features]
no-entrypoint = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
enable-log = []
client = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed", "event-cpi"] }
anchor-spl = { version = "0.32.1", features = ["memo", "metadata"] }

uint = "0.10.0"
solana-security-txt = "1.1.1"
bytemuck = { version = "1.4.0", features = ["derive", "min_const_generics"] }
arrayref = { version = "0.3.6" }

[dev-dependencies]
spl-math = { version = "0.3", features = ["no-entrypoint"] }
quickcheck = "1.0.3"
proptest = "1.0"
rand = "0.9.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
